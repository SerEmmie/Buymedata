  <body class="bg-[#FAFAFC] text-[#191923] antialiased selection:bg-[#6741D9]/20 selection:text-[#6741D9]">
    <div id="root">
      <div id="buymedata-preloader" style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; background-color: #FAFAFC; padding: 24px; text-align: center;">
        <div style="width: 48px; height: 48px; border-radius: 50%; border: 3px solid rgba(103, 65, 217, 0.2); border-top-color: #6741D9; animation: buymedata-spin 0.8s linear infinite; margin-bottom: 20px;"></div>
        <h1 style="font-size: 20px; font-weight: 800; color: #191923; margin: 0 0 8px 0; letter-spacing: -0.02em;">Loading BuyMeData...</h1>
        <p style="font-size: 13px; color: #71717A; margin: 0; max-width: 340px;">Empowering creators, individuals, and causes across Nigeria.</p>
        <style>@keyframes buymedata-spin{to{transform:rotate(360deg)}}</style>
        <noscript>
          <p style="color: #DC2626; margin-top: 16px; font-size: 12px; font-weight: 600;">Please enable JavaScript to run BuyMeData.</p>
        </noscript>
      </div>
    </div>
    <script>
      // Production bundle fallback for static hosts without Vite dev runtime (e.g. GitHub Pages root branch)
      (function() {
        if (typeof window !== 'undefined' && window.location.hostname.endsWith('github.io')) {
          setTimeout(function() {
            var preloader = document.getElementById('buymedata-preloader');
            if (preloader) {
              console.log('Loading compiled production bundle...');
              var segs = window.location.pathname.split('/').filter(Boolean);
              var repo = segs.length > 0 ? '/' + segs[0] : '';
              
              var css = document.createElement('link');
              css.rel = 'stylesheet';
              css.href = repo + '/assets/index.css';
              document.head.appendChild(css);

              var js = document.createElement('script');
              js.type = 'module';
              js.crossOrigin = 'anonymous';
              js.src = repo + '/assets/index.js';
              document.body.appendChild(js);
            }
          }, 350);
        }
      })();
    </script>
  </body>
