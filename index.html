<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BuyMeData — Support creators, fund dreams, make an impact</title>
    <meta
      name="description"
      content="BuyMeData lets creators, entrepreneurs, students, and communities receive financial support in Naira through a personalised page and shareable link. A little support goes a long way."
    />
    <link rel="canonical" href="https://buymedata.com/" />

    <!-- Open Graph -->
    <meta property="og:site_name" content="BuyMeData" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://buymedata.com/" />
    <meta property="og:title" content="BuyMeData — A little support goes a long way." />
    <meta
      property="og:description"
      content="Create your personalised support page, share your unique link, launch fundraising goals, and receive contributions securely in Naira."
    />
    <meta property="og:image" content="https://buymedata.com/assets/aistudio/BuyMeData_Brand_Identity_Board_570d4cc9.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="BuyMeData — A little support goes a long way." />
    <meta
      name="twitter:description"
      content="Support creators, fund dreams, make an impact. Create a personalised page and receive contributions securely in Naira."
    />
    <meta name="twitter:image" content="https://buymedata.com/assets/aistudio/BuyMeData_Brand_Identity_Board_570d4cc9.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "name": "BuyMeData",
            "url": "https://buymedata.com",
            "logo": "https://buymedata.com/assets/aistudio/BuyMeData_Modern_Red_Logo_bc72d3ee.png",
            "description": "Creator-support and personal fundraising platform for individuals, creators, entrepreneurs, students, and communities."
          },
          {
            "@type": "WebApplication",
            "name": "BuyMeData",
            "url": "https://buymedata.com",
            "applicationCategory": "FinanceApplication",
            "operatingSystem": "Web",
            "description": "Receive financial support and launch fundraising goals in Naira through personalised pages and shareable links."
          }
        ]
      }
    </script>
  </head>
  <body class="bg-[#F5F6F8] text-[#17191F] antialiased selection:bg-[#F22550]/20 selection:text-[#F22550]">
    <div id="root">
      <div id="buymedata-preloader" style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; background-color: #F5F6F8; padding: 24px; text-align: center;">
        <div style="width: 48px; height: 48px; border-radius: 50%; border: 3px solid rgba(242, 37, 80, 0.2); border-top-color: #F22550; animation: buymedata-spin 0.8s linear infinite; margin-bottom: 20px;"></div>
        <h1 style="font-size: 20px; font-weight: 800; color: #17191F; margin: 0 0 8px 0; letter-spacing: -0.02em;">Loading BuyMeData...</h1>
        <p style="font-size: 13px; color: #6B7280; margin: 0; max-width: 340px;">A little support goes a long way.</p>
        <style>
          @keyframes buymedata-spin { to { transform: rotate(360deg); } }
        </style>
        <noscript>
          <p style="color: #DC2626; margin-top: 16px; font-size: 12px; font-weight: 600;">Please enable JavaScript to run BuyMeData.</p>
        </noscript>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Production bundle fallback for static hosts without Vite dev runtime (e.g. GitHub Pages root branch)
      (function() {
        if (typeof window !== 'undefined' && window.location.hostname.endsWith('github.io')) {
          setTimeout(function() {
            var preloader = document.getElementById('buymedata-preloader');
            if (preloader) {
              console.log('Loading compiled production bundle...');
              var segs = window.location.pathname.split('/').filter(Boolean);
              var repo = segs.length > 0 ? '/' + segs[0] : '';
              
              var css = document.createElement('link');
              css.rel = 'stylesheet';
              css.href = repo + '/assets/index.css';
              document.head.appendChild(css);

              var js = document.createElement('script');
              js.type = 'module';
              js.crossOrigin = 'anonymous';
              js.src = repo + '/assets/index.js';
              document.body.appendChild(js);
            }
          }, 350);
        }
      })();
    </script>
  </body>
</html>
