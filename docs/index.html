    <script>
      // Single Page Application redirect & path resolver for GitHub Pages
      (function() {
        if (window.location.hostname.endsWith('github.io')) {
          // If GitHub Pages is serving the raw repository root (where /src/main.tsx cannot be executed by browser),
          // automatically route to /docs/ where the compiled bundle lives.
          var path = window.location.pathname;
          var hasDocs = path.indexOf('/docs') !== -1;
          var isRawDevHtml = !document.querySelector || !document.querySelector('script[src*="assets/"]');
          if (!hasDocs && isRawDevHtml) {
            var parts = path.split('/').filter(Boolean);
            var repo = parts.length > 0 ? '/' + parts[0] : '';
            var remainder = parts.slice(1).join('/');
            var target = repo + '/docs/' + (remainder ? remainder : '') + window.location.search + window.location.hash;
            if (window.location.pathname !== repo + '/docs/' && window.location.pathname !== repo + '/docs') {
              window.location.replace(target);
            }
          }
        }
      })();
    </script>
